name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ulixdesk
          POSTGRES_PASSWORD: ulixdesk
          POSTGRES_DB: ulixdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ulixdesk -d ulixdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ulixdesk:ulixdesk@127.0.0.1:5432/ulixdesk_test
      ULIXDESK_SESSION_SECRET: ci-session-secret-at-least-32-characters
      ULIXDESK_EXTENSION_IDS: abcdefghijklmnopabcdefghijklmnop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require Node 22.5 or newer
        run: node -e "const [major,minor]=process.versions.node.split('.').map(Number); if (major<22 || (major===22 && minor<5)) { console.error('Node >= 22.5 required, got '+process.versions.node); process.exit(1); }"
      - name: Install
        run: npm ci
      - name: Create test databases
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "postgresql://ulixdesk:ulixdesk@127.0.0.1:5432/ulixdesk" -c "CREATE DATABASE ulixdesk_test;"
          psql "postgresql://ulixdesk:ulixdesk@127.0.0.1:5432/ulixdesk" -c "CREATE DATABASE ulixdesk_e2e;"
      - name: Reject agent artifact paths in e2e
        run: |
          if grep -R -n -F '/opt/cursor/artifacts' e2e; then
            echo "e2e tests must write screenshots to ULIXDESK_E2E_ARTIFACTS or the Playwright output directory."
            exit 1
          fi
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Install system tools for end-to-end tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: End-to-end tests
        run: npm run test:e2e

  image-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ulixdesk
          POSTGRES_PASSWORD: ulixdesk
          POSTGRES_DB: ulixdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ulixdesk -d ulixdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: |
          docker build \
            --build-arg ULIXDESK_COMMIT="$GITHUB_SHA" \
            --build-arg ULIXDESK_BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            -t ulixdesk:ci .
      - name: Migrate, start, and render a PDF
        run: |
          set -eu
          query_engine=$(grep 'PRISMA_QUERY_ENGINE_LIBRARY:' docker-compose.prod.yml | awk '{print $2}' | sort -u)
          schema_engine=$(grep 'PRISMA_SCHEMA_ENGINE_BINARY:' docker-compose.prod.yml | awk '{print $2}' | sort -u)
          [ "$query_engine" = "/app/node_modules/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node" ]
          [ "$schema_engine" = "/app/node_modules/@prisma/engines/schema-engine-debian-openssl-3.0.x" ]
          grep -q "ENV PRISMA_QUERY_ENGINE_LIBRARY=$query_engine" Dockerfile
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "postgresql://ulixdesk:ulixdesk@127.0.0.1:5432/ulixdesk" \
            -c "CREATE ROLE ulixdesk_app LOGIN PASSWORD 'ulixdeskapp';"
          docker run -d -t --name ulixdesk-smoke --network host --memory=384m \
            -e DATABASE_URL='postgresql://ulixdesk_app:ulixdeskapp@127.0.0.1:5432/ulixdesk' \
            -e MIGRATE_DATABASE_URL='postgresql://ulixdesk:ulixdesk@127.0.0.1:5432/ulixdesk?connection_limit=1' \
            -e ULIXDESK_SESSION_SECRET='ci-session-secret-at-least-32-characters' \
            -e ULIXDESK_PUBLIC_ORIGIN='https://staging.desk.ulixdigital.com' \
            -e ULIXDESK_EXTENSION_IDS='abcdefghijklmnopabcdefghijklmnop' \
            -e ULIXDESK_BOOTSTRAP_EMAIL='smoke@ulix.test' \
            -e ULIXDESK_BOOTSTRAP_PASSWORD='smoke-password-10' \
            -e ULIXDESK_BOOTSTRAP_NAME='Smoke' \
            -e CHECKPOINT_DISABLE=1 \
            -e "PRISMA_SCHEMA_ENGINE_BINARY=$schema_engine" \
            -e "PRISMA_QUERY_ENGINE_LIBRARY=$query_engine" \
            ulixdesk:ci
          ok=0
          for _ in $(seq 1 40); do
            if docker exec ulixdesk-smoke node -e "fetch('http://127.0.0.1:3000/api/health',{redirect:'manual'}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"; then
              ok=1
              break
            fi
            sleep 3
          done
          echo "----- container logs -----"
          docker logs ulixdesk-smoke
          echo "----- end logs -----"
          docker inspect --format 'image_bytes={{.Size}}' ulixdesk:ci
          [ "$ok" = 1 ]
          docker logs ulixdesk-smoke 2>&1 | grep -q "Migrations applied."
          docker logs ulixdesk-smoke 2>&1 | grep -q "Connecting for migrations as ulixdesk."
          docker logs ulixdesk-smoke 2>&1 | grep -q "Starting the app as ulixdesk_app."
          docker logs ulixdesk-smoke 2>&1 | grep -q "Created the owner account smoke@ulix.test."
          psql "postgresql://ulixdesk:ulixdesk@127.0.0.1:5432/ulixdesk" <<'SQL'
          GRANT USAGE ON SCHEMA public TO ulixdesk_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO ulixdesk_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO ulixdesk_app;
          SQL
          user_id=$(psql "postgresql://ulixdesk:ulixdesk@127.0.0.1:5432/ulixdesk" -tA \
            -c "SELECT id FROM \"User\" WHERE email = 'smoke@ulix.test';")
          [[ "$user_id" =~ ^[a-z0-9]+$ ]]
          creds=$(docker exec ulixdesk-smoke node --input-type=module -e '
            import { createHash, randomBytes } from "node:crypto";
            import { signSessionCookie } from "/app/scripts/session-cookie.mjs";
            const token = randomBytes(32).toString("base64url");
            const hash = createHash("sha256").update(token).digest("hex");
            const cookie = signSessionCookie(token, process.env.ULIXDESK_SESSION_SECRET);
            process.stdout.write(hash + "\n" + cookie + "\n");
          ')
          token_hash=$(printf '%s\n' "$creds" | sed -n '1p')
          session_cookie=$(printf '%s\n' "$creds" | sed -n '2p')
          [[ "$token_hash" =~ ^[a-f0-9]{64}$ ]]
          [ -n "$session_cookie" ]
          psql "postgresql://ulixdesk:ulixdesk@127.0.0.1:5432/ulixdesk" \
            -c "INSERT INTO \"Session\" (\"id\", \"userId\", \"tokenHash\", \"expiresAt\") VALUES ('smoke-extension', '$user_id', '$token_hash', NOW() + interval '1 hour');"
          docker exec -e ULIXDESK_SMOKE_COOKIE="$session_cookie" ulixdesk-smoke \
            node scripts/smoke-extension-download.mjs
          docker run --rm --memory=384m --memory-swap=384m ulixdesk:ci \
            node scripts/render-invoice-sample.mjs /tmp/invoice-sample.pdf
          echo "PDF render exited 0 under --memory=384m."

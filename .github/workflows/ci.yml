name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ulixdesk
          POSTGRES_PASSWORD: ulixdesk
          POSTGRES_DB: ulixdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ulixdesk -d ulixdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ulixdesk:ulixdesk@127.0.0.1:5432/ulixdesk_test
      ULIXDESK_SESSION_SECRET: ci-session-secret-at-least-32-characters
      ULIXDESK_EXTENSION_IDS: abcdefghijklmnopabcdefghijklmnop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Create test databases
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "postgresql://ulixdesk:ulixdesk@127.0.0.1:5432/ulixdesk" -c "CREATE DATABASE ulixdesk_test;"
          psql "postgresql://ulixdesk:ulixdesk@127.0.0.1:5432/ulixdesk" -c "CREATE DATABASE ulixdesk_e2e;"
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
